[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-prusa-connect"
version = "0.2.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "aiohttp>=3.9",
]

# This repo ships a Home Assistant custom component rather than a distributable
# library; declaring the package explicitly stops setuptools auto-discovery from
# tripping over the top-level custom_components/ and tests/ directories.
[tool.setuptools]
packages = ["custom_components.prusa_connect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v"

[tool.coverage.run]
source = ["custom_components"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
